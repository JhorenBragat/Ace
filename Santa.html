<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 Santa's Christmas Wish Portal 🎄</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(180deg,#001f3f,#0c3c78,#143d64);
overflow-x:hidden;
color:white;
position:relative;
}

/* Snow */
.snowflake{
position:fixed;
top:-20px;
pointer-events:none;
animation:snow linear infinite;
z-index:1;
}

@keyframes snow{
from{
transform:translateY(-10vh);
}
to{
transform:translateY(120vh);
}
}

/* Lights */
.lights{
display:flex;
justify-content:center;
gap:10px;
padding:20px;
z-index:10;
position:relative;
}

.bulb{
width:20px;
height:20px;
border-radius:50%;
animation:blink 1s infinite alternate;
}

.bulb:nth-child(1){background:red;}
.bulb:nth-child(2){background:yellow;}
.bulb:nth-child(3){background:green;}
.bulb:nth-child(4){background:blue;}
.bulb:nth-child(5){background:pink;}
.bulb:nth-child(6){background:orange;}
.bulb:nth-child(7){background:cyan;}
.bulb:nth-child(8){background:gold;}

@keyframes blink{
from{opacity:1;}
to{
opacity:.4;
box-shadow:0 0 20px white;
}
}

/* Santa */
.santa{
position:fixed;
top:80px;
left:-500px;
font-size:70px;
z-index:2;
animation:flySanta 20s linear infinite;
}

@keyframes flySanta{
from{left:-500px;}
to{left:120%;}
}

/* Music */
.music-btn{
position:fixed;
top:15px;
right:15px;
z-index:1000;
padding:12px 20px;
background:#d32f2f;
color:white;
border:none;
border-radius:30px;
cursor:pointer;
font-weight:bold;
}

/* Card */
.card{
max-width:750px;
width:95%;
margin:30px auto;
padding:30px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(12px);
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
text-align:center;
position:relative;
z-index:10;
}

h1{
margin-bottom:15px;
font-size:2.5rem;
}

h2{
margin-bottom:15px;
}

input,
textarea{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:12px;
font-size:16px;
}

button{
border:none;
cursor:pointer;
}

.primary-btn,
.enter-btn{
margin-top:20px;
padding:14px 28px;
background:#e53935;
color:white;
font-size:18px;
font-weight:bold;
border-radius:40px;
transition:.3s;
}

.primary-btn:hover,
.enter-btn:hover{
transform:scale(1.05);
}

.countdown{
color:#ffd54f;
font-size:22px;
margin:15px 0;
}

/* Gifts */
.gift-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:20px;
margin-top:25px;
}

.gift{
padding:25px;
font-size:22px;
border-radius:20px;
background:rgba(255,255,255,.15);
cursor:pointer;
transition:.3s;
}

.gift:hover{
transform:translateY(-5px);
background:#c62828;
}

.selected{
border:3px solid gold;
box-shadow:0 0 20px gold;
}

.hidden{
display:none;
}

.success{
font-size:22px;
color:#7CFC00;
}

/* Admin */
.admin-lock{
position:fixed;
bottom:20px;
right:20px;
width:65px;
height:65px;
background:#c62828;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
cursor:pointer;
box-shadow:0 0 20px rgba(0,0,0,.4);
z-index:1000;
}

.admin-popup{
position:fixed;
bottom:95px;
right:20px;
width:300px;
padding:20px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
border-radius:20px;
z-index:1000;
}

.admin-popup button{
width:100%;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid rgba(255,255,255,.3);
padding:10px;
}

th{
background:#c62828;
}

/* Responsive */
@media(max-width:768px){

h1{
font-size:1.8rem;
}

.gift-grid{
grid-template-columns:repeat(2,1fr);
}

.admin-popup{
width:90%;
right:5%;
}

.music-btn{
font-size:14px;
}

.santa{
font-size:50px;
}
}

@media(max-width:480px){

.gift-grid{
grid-template-columns:1fr;
}

h1{
font-size:1.5rem;
}

.admin-lock{
width:55px;
height:55px;
}

.admin-popup{
width:95%;
right:2.5%;
}
}
</style>
</head>

<body>

<audio id="music" loop>
<source src="./assets/audio/jingle-bells.mp3" type="audio/mp4">
</audio>

<button class="music-btn" onclick="toggleMusic()">
🔊 Music
</button>

<div class="lights">
<div class="bulb"></div>
<div class="bulb"></div>
<div class="bulb"></div>
<div class="bulb"></div>
<div class="bulb"></div>
<div class="bulb"></div>
<div class="bulb"></div>
<div class="bulb"></div>
</div>

<div class="santa">🎅🦌🦌🦌</div>

<!-- STEP 1 -->
<div class="card" id="step1">

<h1>🎄 Christmas Wish Portal 🎄</h1>

<div id="countdown" class="countdown"></div>

<h2>Ho Ho Ho! Maayung Pasko!</h2>

<button class="enter-btn" onclick="startChristmasExperience()">
🎄 Maayong Pasko 🎄
</button>

<input id="name" placeholder="Enter Your Name">

<input id="age" type="number" placeholder="Enter Your Age">

<textarea id="wish" rows="5"
placeholder="What do you wish for this Christmas?"></textarea>

<button class="primary-btn" onclick="nextStep()">
Next ➜
</button>

</div>

<!-- STEP 2 -->
<div class="card hidden" id="step2">

<h1>🎁 Choose Your Gift Category</h1>

<div class="gift-grid">
<div class="gift" onclick="selectGift(this,'Bag')">👜<br>Bag</div>
<div class="gift" onclick="selectGift(this,'Shirt')">👕<br>Shirt</div>
<div class="gift" onclick="selectGift(this,'Shoes')">👟<br>Shoes</div>
<div class="gift" onclick="selectGift(this,'Tools')">🛠️<br>Tools</div>
<div class="gift" onclick="selectGift(this,'Toys')">🧸<br>Toys</div>
<div class="gift" onclick="selectGift(this,'Other')">⭐<br>Other</div>
</div>

<button class="primary-btn" onclick="submitWish()">
Send Wish To Santa 🎅
</button>

</div>

<!-- SUCCESS -->
<div class="card hidden" id="success">

<h1>🎄 Merry Christmas 🎄</h1>

<div class="success">
Santa has received your Christmas wish! 🎁
</div>

</div>

<!-- LOCK -->
<div class="admin-lock" onclick="toggleAdminLogin()">
🔒
</div>

<!-- ADMIN POPUP -->
<div class="admin-popup hidden" id="adminLoginBox">

<h2>🔒 Admin Login</h2>

<input id="adminUser" placeholder="Username">

<input id="adminPass" type="password" placeholder="Password">

<button class="primary-btn" onclick="adminLogin()">
Login
</button>

</div>

<!-- ADMIN PANEL -->
<div class="card hidden" id="adminPanel">

<h1>📋 Wishes Dashboard</h1>

<table>
<thead>
<tr>
<th>Name</th>
<th>Age</th>
<th>Wish</th>
<th>Category</th>
</tr>
</thead>

<tbody id="wishTable"></tbody>
</table>

</div>

<script>

/* Snow */
for(let i=0;i<80;i++){
const snow=document.createElement("div");
snow.className="snowflake";
snow.innerHTML="❄";
snow.style.left=Math.random()*100+"%";
snow.style.fontSize=(10+Math.random()*20)+"px";
snow.style.animationDuration=(5+Math.random()*8)+"s";
document.body.appendChild(snow);
}

/* Countdown */
function updateCountdown(){

const now=new Date();
let year=now.getFullYear();

let christmas=new Date(year,11,25);

if(now>christmas){
christmas=new Date(year+1,11,25);
}

const diff=christmas-now;

const days=Math.floor(diff/(1000*60*60*24));

document.getElementById("countdown").innerHTML=
`🎄 ${days} Days Until Christmas 🎄`;

}

updateCountdown();
setInterval(updateCountdown,1000);

/* Music */
function startChristmasExperience(){

const music=document.getElementById("music");

music.play().catch(()=>{});

speechSynthesis.speak(
new SpeechSynthesisUtterance(
"Ho Ho Ho. Maayung Pasko sa imo."
)
);

}

function toggleMusic(){

const music=document.getElementById("music");
const btn=document.querySelector(".music-btn");

if(music.paused){

music.play().catch(()=>{});
btn.innerHTML="🔊 Music On";

}else{

music.pause();
btn.innerHTML="🔇 Music Off";

}

}

/* Form */
let giftSelected="";
let formData={};

function nextStep(){

const name=document.getElementById("name").value.trim();
const age=document.getElementById("age").value.trim();
const wish=document.getElementById("wish").value.trim();

if(!name || !age || !wish){
alert("Please complete all fields.");
return;
}

formData={
name,
age,
wish
};

document.getElementById("step1")
.classList.add("hidden");

document.getElementById("step2")
.classList.remove("hidden");

}

function selectGift(el,gift){

document.querySelectorAll(".gift")
.forEach(x=>x.classList.remove("selected"));

el.classList.add("selected");

giftSelected=gift;

}

function submitWish(){

if(!giftSelected){

alert("Choose a gift category.");
return;

}

formData.category=giftSelected;

let wishes=JSON.parse(
localStorage.getItem("christmasWishes")
)||[];

wishes.push(formData);

localStorage.setItem(
"christmasWishes",
JSON.stringify(wishes)
);

document.getElementById("step2")
.classList.add("hidden");

document.getElementById("success")
.classList.remove("hidden");

}

/* Admin */
const ADMIN_USER="moren";
const ADMIN_PASS="081824";

function toggleAdminLogin(){

document.getElementById("adminLoginBox")
.classList.toggle("hidden");

}

function adminLogin(){

const u=document.getElementById("adminUser").value;
const p=document.getElementById("adminPass").value;

if(u===ADMIN_USER && p===ADMIN_PASS){

document.getElementById("adminLoginBox")
.classList.add("hidden");

document.getElementById("adminPanel")
.classList.remove("hidden");

loadWishes();

}else{

alert("Invalid Login");

}

}

function loadWishes(){

const wishes=JSON.parse(
localStorage.getItem("christmasWishes")
)||[];

let rows="";

wishes.forEach(x=>{

rows+=`
<tr>
<td>${x.name}</td>
<td>${x.age}</td>
<td>${x.wish}</td>
<td>${x.category}</td>
</tr>
`;

});

document.getElementById("wishTable")
.innerHTML=rows;

}
</script>

</body>
</html>
